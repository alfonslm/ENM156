# C++ plugin (plugin/): only runs for changes there, so syncing with upstream
# never triggers it. See plugin/README.md.
name: plugin

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

jobs:
  # Fast path: core + cli + tests, no JUCE
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build plugin/build --config Release --parallel
      - name: Test
        run: ctest --test-dir plugin/build -C Release --output-on-failure

  # VST3 + ARA plugin (fetches JUCE and the ARA SDK)
  vst3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev pkg-config
      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release -DDENOISER_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build plugin/build --config Release --parallel
      - name: Test (core tests + plugin_passthrough, which loads the VST3)
        run: ctest --test-dir plugin/build -C Release --output-on-failure
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: vst3-${{ matrix.os }}
          path: plugin/build/vst/DenoiserPlugin_artefacts/Release/VST3/
